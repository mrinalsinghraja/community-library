name: Bug report
description: Something does not work the way it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. **Please do not include real children's names, photographs, guardian details, passwords or other secrets** — in the text or in screenshots. Use the demo data (`npm run db:seed:demo`) to reproduce.

        Found a security problem? Do not post it here. Email mrinalsinghraja@gmail.com instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, and what did you see?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as the demo reader
        2. Open the catalogue
        3. ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen?
      options:
        - A live library site
        - My own copy (local or deployed)
        - Not sure
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, device and Node version (if relevant)
      placeholder: Safari on iPhone, or Node 24.x
