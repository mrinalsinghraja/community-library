name: Dependabot patch auto-merge

# Merges the weekly grouped patch-update PR once CI has passed on it. Minor and
# major bumps are left for a person. No code from the PR is checked out or run
# here: the job only reads the finished CI result and calls the merge API.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/') &&
      contains(github.event.workflow_run.head_branch, 'patch-updates')
    runs-on: ubuntu-latest
    steps:
      - name: Squash-merge the patch group
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$PR" ]; then echo "no PR attached to this run"; exit 0; fi
          gh pr merge "$PR" --repo "$REPO" --squash
